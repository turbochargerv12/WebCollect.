<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebCollect Editor</title><link rel="stylesheet" href="editor.css"></head><body><main class="app"><header class="header"><div class="identity"><b>WebCollect</b><span>Collect. Edit. Export.</span></div><div class="export"><button id="downloadHTML">Download HTML</button><button id="pdf">Download PDF</button></div></header><div class="workspace"><aside class="settings"><label class="field">Paper:<select id="paper"><option value="a4">A4</option><option value="long">Long page</option></select></label><label class="field">Document Scale: <span id="scaleText">100%</span><input id="docScale" type="range" min="40" max="120" step="5" value="100"></label><label class="field">File Name:<input id="filename" type="text" placeholder="Document title"></label><button id="addText" class="quiet">+ Add Text Block</button><button id="save" class="quiet">Save Edits</button><div id="status" role="status"></div><div class="settings-spacer"></div><button id="clear" class="danger">Clear Collection</button></aside><section class="preview" aria-label="Document preview"><div id="empty" class="empty">Preview</div><main id="sheet"><div id="content"></div></main></section></div></main><script src="editor.js"></script></body></html>
